interface:
  display_name: "大数据挑战赛论文 Skill"
  short_description: "未知赛题、数据分析、建模验证、科研图表与竞赛论文全流程"
  default_prompt: "Read skills/big-data-competition-skill/SKILL.md first. Treat the current competition as unknown until the official problem statement and attachments establish its task structure. Build the Competition Contract, audit data non-destructively, identify task objective and structure, select methods from evidence rather than habit, establish a credible baseline, design leakage-resistant validation, preserve experiment provenance, and connect accepted results to figures, tables, claims, and the competition paper. The final deliverable is paper-first, not a Kaggle leaderboard submission. Do not invent execution results. When user code must run locally, generate and inspect it but rely on returned artifacts for numerical claims. Read only the reference files required by the current task."

user_execution:
  default_owner: user
  profile: full_fidelity
  task_code_execution_allowed: false
