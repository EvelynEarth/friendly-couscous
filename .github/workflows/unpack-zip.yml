name: Recover ZIP workflow files

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-zip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover workflow files from ZIP in history
        shell: bash
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          import subprocess
          import zipfile

          repo = Path.cwd()
          source_commit = 'c537b640549c5496c71749d676e85da18b657b59'
          archive = subprocess.run(
              ['git', 'show', f'{source_commit}:mathmodel-skill-main.zip'],
              check=True,
              stdout=subprocess.PIPE,
          ).stdout

          payload_root = repo / '.workflow_payload'
          payload_root.mkdir(exist_ok=True)

          recovered = 0
          with zipfile.ZipFile(BytesIO(archive)) as zf:
              for info in zf.infolist():
                  if info.is_dir():
                      continue
                  parts = Path(info.filename).parts
                  try:
                      idx = parts.index('.github')
                  except ValueError:
                      continue
                  if len(parts) <= idx + 2 or parts[idx + 1] != 'workflows':
                      continue
                  rel_parts = parts[idx + 2:]
                  if not rel_parts:
                      continue
                  target = payload_root.joinpath(*rel_parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(zf.read(info))
                  print(f'Recovered {"/".join(rel_parts)}')
                  recovered += 1

          if recovered == 0:
              raise SystemExit('No workflow files found in ZIP history')
          PY

      - name: Commit recovered workflow payloads
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .workflow_payload
          if git diff --cached --quiet; then
            echo 'No payload changes to commit.'
            exit 0
          fi
          git commit -m 'Recover workflow files from ZIP'
          git push origin HEAD:main
