name: Big Data Competition Skill CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bigdata-skill-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-contract:
    name: Big data Skill contract & links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate active paper-first Skill, versions and references
        run: python scripts/validate_bigdata_skill.py
      - name: Verify 16 paper records remain evidence-honest
        run: python skills/big-data-competition-skill/tools/award_paper_audit.py --summary
      - name: Run historical scenario adversarial contract suite
        run: python skills/big-data-competition-skill/tools/competition_benchmark.py
      - name: Verify v2.4 universal quality audit CLIs
        run: |
          python skills/big-data-competition-skill/tools/solution_quality_gate.py --help
          python skills/big-data-competition-skill/tools/stability_audit.py --help
      - name: Validate historical source snapshot and new CLIs
        run: |
          python -m json.tool skills/big-data-competition-skill/competition/real_case_2025_profiles.json > /dev/null
          python skills/big-data-competition-skill/tools/real_case_audit.py --help
          python skills/big-data-competition-skill/tools/paper_evidence_gate.py --help

  unit-matrix:
    name: Python ${{ matrix.python-version }} (bigdata)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Run active Big Data Skill tests
        run: python -m unittest discover -s tests -p 'test_bigdata_*.py' -v

  generated-indexes:
    name: Big data active index & manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify deterministic active metadata
        run: python scripts/generate_indexes.py --check

# Historical HSK tests assert mathematical-modeling v7.13.0 as root and are not
# the active big-data Skill tests. They remain in Git for opt-in migration.
