version: 1.4.0
introduced_in_skill_version: 7.4.2
skill_compatibility: '>=7.4.2,<8.0.0'
purpose: 约束条件启用的项目级数据预处理、题目专属Python主求解与结果深化分析代码的规模、可读性、反过度工程、跨产物身份一致性和静态工程质量；不替代Problem Contract、模型语义正确性、preprocessing_decision、预处理质量门、论文预处理证据与数值结果质量门。
scope:
- 数据预处理/数据预处理.py
- 问题X求解/问题X求解.py
- 问题X求解/问题X结果深化分析.py
- repair/redesign期间尚未冻结的题目专属候选Python脚本
line_count:
  metric: nonblank_physical_lines
  target_max: 500
  warning_max: 700
  hard_max: 700
  exemption_max: 900
  exemption_field: code_quality_exemption
  exemption_required_fields: [enabled, reason]
  exemption_reason_min_chars: 20
  policy: 501--700行给出warning；超过700行默认failed；只有复杂题显式说明无法进一步精简的原因时才允许到900行；超过900行始终failed。
function_size:
  target_max: 80
  warning_max: 120
  hard_max: 120
parameter_count:
  target_max: 8
  warning_max: 12
  hard_max: 12
complexity:
  warning_max: 15
  hard_max: 25
print_calls:
  warning_count: 1
  hard_count: 5
forbidden_import_roots: [matplotlib, seaborn]
hard_antipatterns:
  wildcard_import: true
  bare_except: true
  breakpoint_call: true
  pdb_set_trace: true
  duplicate_top_level_definitions: true
warning_antipatterns:
  unused_import: true
  any_print_call: true
artifact_identity_contract:
  required_runtime_identity:
    - question_id
    - stage
    - artifact_version_or_candidate_id
    - semantic_revision_or_bound_model_hash_when_available
    - resolved_input_path_summary
    - output_workbook_path
  consumer_binding:
    - 结果深化分析脚本只能绑定已验收主工作簿；绑定至少包含实际路径、文件身份或哈希、实际工作表名和需要字段。
    - 绘图/分析消费者不得凭模板猜测上游工作簿存在某个工作表或字段；生成消费者前必须先实际核验上游接口。
    - 如果工作簿实际工作表/字段与已绑定合同不一致，fail-fast并报告actual vs required；不得静默搜索相似表名、切换另一工作簿或自动补造缺失sheet。
    - 同一问题的主求解、深化分析与绘图必须携带一致question_id；发现上一问/另一问身份时直接停止。
  filename_policy:
    - 脚本可以打印期望canonical文件名作为提示，但不得仅因用户本地重命名脚本而RuntimeError；正式身份由内部stage/question/candidate fingerprint与输入输出合同决定。
    - 只有官方外部协议明确要求固定文件名时才允许把文件名不匹配作为硬失败，并必须在代码交付前说明该外部要求。
    - repair/redesign期间每次实质修改使用新的candidate/version后缀，不覆盖用户正在比较的上一版；用户明确接受后再同步唯一canonical文件名。
  failure_recovery:
    - FileNotFoundError后重新观察项目树和实际候选路径，不得原样重复同一错误路径假设。
    - 缺sheet/header后先列出实际sheet/header，再重新绑定接口；不得用另一阶段的“标准工作表”清单强压当前上游工作簿。
    - 同一根因连续两次失败时必须停止机械改名/改路径，先给出root-cause diagnosis和最小修复范围。
result_semantics_contract:
  ties_and_near_ties:
    - 优化/枚举结果若存在精确并列或在声明容差内并列，必须保留完整并列最优集合；不得为了给出单一方案而任意选一个写成“唯一最优”。
    - 必须区分exact tie、tolerance tie和small-but-nonzero gap；三者在正文、工作簿和图中不得混写。
    - 若最优方案对参数变化存在切换，稳健性表述应报告切换边界、利润/目标gap或稳定区，而不是只说“敏感性分析通过”。
  plausibility:
    - 主结果质量门通过后仍需结合单位、边界、约束、退化情形和题意机制做post-execution review；程序成功运行不等于结果合理。
principles:
- 成熟科学计算库优先，不手写无必要的低质量替代实现。
- 代码工程质量门必须位于semantic_governance gate之后；代码不能静默引入数学层没有定义的核心变量、目标项、约束、阈值或预处理语义。
- 所有数据题先基于当前题目、当前附件与模型要求执行非破坏性数据审计并锁定preprocessing_decision；共享原始数据、检测到缺失或某类赛题过去常见处理本身不能触发清洗、插值、预测填补、滤波或统一工作簿。
- 只有preprocessing_decision=project_level时才生成数据预处理.py；该脚本只保留路径与字段检查、数据审计、已批准公共处理、论文方法/验证/处理前后绘图底层证据、预处理质量门、统一工作簿输出和主入口，不求解任何小问核心模型。
- preprocessing_decision=not_needed时，主求解和深化分析允许直接读取原始数据并做非破坏性检查，不得为了流程完整虚构数据处理。
- preprocessing_decision=question_local时，主求解和深化分析允许从原始数据构造本问数学层已经定义的局部变换，但不得把本问变换升级为全局清洗；实质变换必须输出足够的验证/绘图底层数据供论文与qX_plot.m使用。
- preprocessing_decision=project_level时，主求解和结果深化分析脚本不得直接读取对应共享原始数据源，不得重复项目级去缺失、异常处理、单位换算、统一滤波、统一重采样或坐标修正。
- 缺失填补、预测填补、异常删除、插值、平滑、滤波、去噪、去趋势、标准化、归一化和重采样等操作必须在数学/数据语义层有必要性证据；有缺失不等于必须插值，任何学习型填补必须遵守训练验证边界并防止信息泄漏。
- 赛题本身要求预测未来值、未知类别、需求、风险或其他最终结果时，该预测属于核心模型，不得写入数据预处理脚本提前生成答案。
- 主求解脚本只保留当前数据事实源读取与字段检查、模型求解、约束/残差或题型质量检查、主结果整理、主工作簿输出和主入口。
- 结果深化分析脚本只保留当前数据事实源和已验收主结果读取、题目专属深化分析、稳定性判定、深化工作簿输出和主入口；不得复制主求解主链。
- 主求解、深化分析和后续绘图之间的接口必须以实际文件/工作表/字段合同绑定，禁止consumer凭记忆或旧版本假设上游结构。
- 题目专属脚本的身份不能只靠物理文件名；用户本地改名不应触发与数学无关的硬失败，使用内部question/stage/version fingerprint进行身份确认。
- 删除无用import、调试print、重复逻辑、死代码、伪抽象和未来脚手架。
- Python不承担论文结果图绘制；project_level预处理图由data_process.m读取统一工作簿，各问结果图由qX_plot.m读取标准结果工作簿。MATLAB不得重新计算核心预处理或求解结果。
- 代码长度是工程质量门，不得为了压行数删除随机种子、目标函数、约束、质量检查、结果输出、预处理验证或复现信息。
