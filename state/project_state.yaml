decisions:
  Q1:
    selected_model: Capacitated Facility Location + Network Flow MILP
    rejected_models:
    - GA/PSO等元启发式作为主模型
    key_reason: 题目规模小且结构线性，MILP可精确求解；设施组合枚举+LP可作为独立精确交叉验证。
    solver_candidates:
    - MILP solver
    - facility enumeration + LP cross-check
    validation_plan:
    - solver optimal status
    - MIP gap
    - 最大约束违反量
    - 枚举+LP一致性
    result_analysis_candidates:
    - 设施利用率
    - 路径流量结构
    - 成本分解
  Q2:
    selected_model: Two-stage Finite-scenario Stochastic MILP
    rejected_models:
    - CVaR作为主目标
    key_reason: 题面给定完整场景概率并直接要求期望总成本；CVaR需额外风险偏好参数，当前仅适合作为补充敏感性。
    solver_candidates:
    - extensive-form MILP
    - Q1-layout fixed risk benchmark
    validation_plan:
    - solver optimal status
    - MIP gap
    - 逐场景容量/守恒/需求残差
    - Q1布局风险基准
    result_analysis_candidates:
    - 风险代价
    - 期望需求满足率
    - 最坏服务损失
    - 风险重设计价值
  Q3:
    selected_model: Response-phase Stochastic Resilience Investment & Emergency Recourse MILP
    rejected_models:
    - 逐日time-expanded MILP作为主模型
    - GA/ALNS等启发式
    key_reason: 资源可用状态只在0、2天、7天发生变化，事件驱动阶段压缩保留题面全部响应信息；二元投资仅2个，可枚举4种组合并与MILP精确交叉验证。
    solver_candidates:
    - MILP solver
    - 4-contract-combination enumeration + LP cross-check
    validation_plan:
    - solver optimal status
    - MIP gap
    - 预算/库存/应急容量/市场平衡残差
    - 枚举+LP一致性
    - R3-off/transport-only替代口径敏感性
    result_analysis_candidates:
    - 韧性投资成本效益
    - 缺货下降与服务率提升
    - E3时间轴与恢复时间
    - R3替代口径敏感性
