decisions:
  Q1:
    selected_model: Capacitated Facility Location + Network Flow MILP
    rejected_models:
    - GA/PSO等元启发式作为主模型
    key_reason: 线性小规模结构可精确求解；设施组合枚举+LP可独立交叉验证。
    solver_candidates:
    - MILP solver
    - facility enumeration + LP cross-check
    validation_plan:
    - solver optimal status
    - MIP gap
    - 最大约束违反量
    - 枚举+LP一致性
    result_analysis_candidates:
    - 设施利用率
    - 路径流量结构
    - 成本分解
  Q2:
    selected_model: Two-stage Finite-scenario Stochastic MILP
    rejected_models:
    - CVaR作为主目标
    key_reason: 题面给定场景概率并要求期望总成本；CVaR需要额外风险偏好参数。
    solver_candidates:
    - extensive-form MILP
    - Q1-layout fixed risk benchmark
    validation_plan:
    - solver optimal status
    - MIP gap
    - 逐场景容量/守恒/需求残差
    - Q1布局风险基准
    result_analysis_candidates:
    - 风险代价
    - 期望需求满足率
    - 最坏服务损失
    - 风险重设计价值
  Q3:
    selected_model: Response-phase Stochastic Resilience Investment MILP with Source-Conserving Air-Transport Coupling
    rejected_models:
    - 将R3解释为独立外部应急供给
    - 逐日time-expanded MILP作为主模型
    - GA/ALNS等启发式
    key_reason: 用户明确选择R3纯运输口径；R3必须绑定正常剩余供给或R1/R2/R4货源并满足源守恒，不能创造供给。0/2天/7天阶段保留全部响应节点。
    solver_candidates:
    - MILP solver
    - 4-contract-combination enumeration + LP cross-check
    validation_plan:
    - solver optimal status
    - MIP gap
    - 预算/库存/市场平衡残差
    - R3空运容量残差
    - R3货源守恒残差
    - 枚举+LP一致性
    result_analysis_candidates:
    - 韧性投资成本效益
    - 缺货下降与服务率提升
    - E3时间轴与恢复时间
    - R3空运来源与利用率
    - R3不活跃时的数据边界解释
